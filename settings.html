<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zengen Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main>
      <header>
        <a href="popup.html" class="back">
          <i data-lucide="arrow-left"></i>
          <span>Back</span>
        </a>

        <h1>Settings</h1>
      </header>

      <section>
        <div class="section-heading">
          <div>
            <h2>Allowed sites</h2>
          </div>
        </div>

        <form id="allow-form" class="add-form">
          <input
            id="allow-input"
            type="text"
            placeholder="example.com"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" aria-label="Add allowed site">
            <i data-lucide="plus"></i>
          </button>
        </form>

        <div id="allow-list" class="site-list"></div>
      </section>

      <section>
        <div class="section-heading">
          <div>
            <h2>Blocked sites</h2>
          </div>
        </div>

        <form id="block-form" class="add-form">
          <input
            id="block-input"
            type="text"
            placeholder="example.com"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" aria-label="Add blocked site">
            <i data-lucide="plus"></i>
          </button>
        </form>

        <div id="block-list" class="site-list"></div>
      </section>

      <p id="error" class="error" aria-live="polite"></p>
    </main>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
