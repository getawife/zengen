<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zengen Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>

  <body>
    <main>
      <header>
        <a href="popup.html" class="back">
          <i data-lucide="arrow-left"></i>
          <span>Back</span>
        </a>

        <h1>Settings</h1>
      </header>

      <section class="sites">
        <div class="site-section pin-section">
          <div class="site-heading">
            <h2>Parental controls</h2>
          </div>

          <form id="pin-form" class="pin-form">
            <input
              id="current-pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Current PIN"
              autocomplete="current-password"
            />
            <input
              id="new-pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="New PIN"
              autocomplete="new-password"
            />
            <input
              id="confirm-pin"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="Confirm PIN"
              autocomplete="new-password"
            />
            <button type="submit">Save PIN</button>
          </form>
        </div>

        <div class="site-section">
          <div class="site-heading">
            <h2>Allowed sites</h2>
          </div>

          <form id="allow-form" class="add-form">
            <input
              id="allow-input"
              type="text"
              placeholder="example.com"
              autocomplete="off"
              spellcheck="false"
            />

            <button type="submit" aria-label="Add allowed site">
              <i data-lucide="plus"></i>
            </button>
          </form>

          <div id="allow-list" class="site-list"></div>
        </div>

        <div class="site-section">
          <div class="site-heading">
            <h2>Blocked sites</h2>
          </div>

          <form id="block-form" class="add-form">
            <input
              id="block-input"
              type="text"
              placeholder="example.com"
              autocomplete="off"
              spellcheck="false"
            />

            <button type="submit" aria-label="Add blocked site">
              <i data-lucide="plus"></i>
            </button>
          </form>

          <div id="block-list" class="site-list"></div>
        </div>

        <p id="error" class="error" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
